<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiQo - Profil Saya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            background-color: #D6E8FF;
            min-height: 100vh;
            color: #000;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: #FFFFFF;
            border-right: 3px solid #000;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { display: none; }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 25px 20px;
            font-size: 24px;
            font-weight: 700;
            color: #000;
        }
        
        .logo img {
            width: 45px;
            height: auto;
        }

        .menu-section { padding: 10px 15px; flex: 1; }

        .menu-item {
            display: block;
            padding: 12px 15px;
            margin-bottom: 5px; 
            border-radius: 8px;
            text-decoration: none;
            color: #000;
            font-weight: 600;
            font-size: 15px;
            transition: 0.2s;
        }

        .menu-item:hover { background-color: #EBF3FF; }
        
        .menu-item.active {
            background-color: #60AFFF; 
            color: #000;
            font-weight: 700;
        }

        .sidebar-bottom { padding: 10px 15px; border-top: 1px solid #ddd; }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        /* TOPBAR & NOTIFIKASI */
        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 40px;
            background-color: #FFFFFF;
            border-bottom: 2px solid #000;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 25px;
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }

        .notification-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .notification-icon {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-dropdown {
            display: none;
            position: absolute;
            top: 35px;
            right: 0;
            width: 300px;
            background-color: #FFFFFF;
            border: 1px solid #000;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            overflow: hidden;
        }

        .notification-dropdown.show { display: block; }

        .notif-header {
            background-color: #60AFFF;
            color: #000;
            padding: 12px 15px;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 1px solid #000;
        }

        .notif-item {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            font-weight: 500;
            line-height: 1.4;
        }

        .notif-item:hover { background-color: #EBF3FF; }
        .notif-item:last-child { border-bottom: none; }
        
        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* CONTENT BODY */
        .content-body { padding: 30px 40px; }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #000;
            margin-bottom: 5px;
        }

        .page-header p {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        /* PROFILE LAYOUT */
        .profile-grid-top {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .white-card {
            background-color: #FFFFFF;
            border: 1px solid #000;
            border-radius: 12px;
            padding: 25px;
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 20px;
            color: #000;
        }

        /* FOTO PROFIL SECTION */
        .photo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
            height: 100%;
        }

        .avatar-circle {
            width: 150px;
            height: 150px;
            background-color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .avatar-circle img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .avatar-circle svg {
            width: 80px;
            height: 80px;
            color: #FFF;
        }

        .btn-blue {
            background-color: #1A539B;
            color: #FFF;
            border: none;
            border-radius: 6px;
            padding: 10px 25px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
            text-align: center;
        }

        .btn-blue:hover {
            background-color: #123B70;
        }

        #uploadFoto {
            display: none;
        }

        /* FORM STYLE */
        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: #000;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            background-color: #E2E8F0;
            border: 1px solid #A0AEC0;
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 14px;
            color: #000;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            background-color: #FFFFFF;
            border-color: #60AFFF;
            box-shadow: 0 0 0 2px rgba(96, 175, 255, 0.2);
        }

        .form-actions {
            display: flex;
            justify-content: flex-end;
            margin-top: 15px;
        }

        /* PASSWORD GRID */
        .password-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        /* TAMBAHAN CSS UNTUK MATA PASSWORD */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        
        .password-wrapper input {
            padding-right: 40px; /* Ruang untuk ikon */
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #555;
            display: flex;
            align-items: center;
        }

    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="Logo">
            <span>ServiQo</span>
        </div>
        
        <div class="menu-section">
            <a href="dashboard_admin.html" class="menu-item">Dashboard</a>
            <a href="omnichannel_inbox.html" class="menu-item">Omnichannel Inbox</a>
            <a href="data_pelanggan.html" class="menu-item">Data Pelanggan</a>
            <a href="tiket_servis.html" class="menu-item">Tiket Servis</a>
            <a href="chatbot.html" class="menu-item">Chatbot</a>
            <a href="data_teknisi.html" class="menu-item">Data Teknisi</a>
            <a href="daftar_suku_cadang.html" class="menu-item">Daftar Suku Cadang</a>
            <a href="laporan.html" class="menu-item">Laporan</a>
        </div>

        <div class="sidebar-bottom">
            <a href="profil_admin.html" class="menu-item active">Profil</a>
            <a href="informasi.html" class="menu-item">Informasi</a>
            <a href="login_admin.html" class="menu-item">Keluar</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        
        <!-- TOPBAR -->
        <div class="topbar">
            <div class="user-info">
                <div class="notification-wrapper">
                    <div class="notification-icon" id="bellIcon" title="Pemberitahuan">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </div>
                    <div class="notification-dropdown" id="notifDropdown">
                        <div class="notif-header">Notifikasi Baru</div>
                        <div class="notif-item"><strong>Sistem:</strong> Selamat datang di pengaturan profil.</div>
                    </div>
                </div>
                
                <div class="profile-info">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Admin
                </div>
            </div>
        </div>

        <div class="content-body">
            
            <div class="page-header">
                <h1>Profil Saya</h1>
                <p>Kelola informasi akun Anda</p>
            </div>

            <!-- PROFIL GRID ATAS -->
            <div class="profile-grid-top">
                
                <!-- CARD KIRI: FOTO PROFIL -->
                <div class="white-card">
                    <div class="photo-section">
                        <div class="avatar-circle" id="avatarContainer">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                        </div>
                        
                        <label for="uploadFoto" class="btn-blue">Ubah Foto</label>
                        <input type="file" id="uploadFoto" accept="image/*">
                    </div>
                </div>

                <!-- CARD KANAN: INFORMASI PRIBADI -->
                <div class="white-card">
                    <div class="card-title">Informasi Pribadi</div>
                    
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input type="text" id="inputNama" value="Admin ServiQo Utama">
                    </div>

                    <div class="form-group">
                        <label>Nomor Telepon</label>
                        <input type="text" id="inputTelp" value="081234567890">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="inputEmail" value="admin@serviqo.com">
                    </div>

                    <div class="form-actions">
                        <button class="btn-blue" id="btnUbahProfil">Ubah Profil</button>
                    </div>
                </div>
            </div>

            <!-- CARD BAWAH: UBAH PASSWORD -->
            <div class="white-card">
                <div class="card-title">Ubah Password</div>
                
                <div class="password-grid">
                    <div class="form-group">
                        <label>Password Lama</label>
                        <div class="password-wrapper">
                            <input type="password" id="passLama" placeholder="Masukkan password lama">
                            <span class="toggle-password" onclick="togglePasswordVisibility('passLama', this)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password Baru</label>
                        <div class="password-wrapper">
                            <input type="password" id="passBaru" placeholder="Masukkan password baru">
                            <span class="toggle-password" onclick="togglePasswordVisibility('passBaru', this)">
                                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                            </span>
                        </div>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn-blue" id="btnSimpanPassword">Simpan</button>
                </div>
            </div>

        </div>
    </div>

    <!-- SCRIPT FUNCTIONAL -->
    <script>
        // 1. Dropdown Lonceng Notifikasi
        const bellIcon = document.getElementById('bellIcon');
        const notifDropdown = document.getElementById('notifDropdown');

        if (bellIcon && notifDropdown) {
            bellIcon.addEventListener('click', function(e) {
                notifDropdown.classList.toggle('show');
                e.stopPropagation(); 
            });

            window.addEventListener('click', function(e) {
                if (!notifDropdown.contains(e.target) && e.target !== bellIcon) {
                    notifDropdown.classList.remove('show');
                }
            });
        }

        // 2. Fungsionalitas Ubah Foto Profil (Upload)
        const uploadFoto = document.getElementById('uploadFoto');
        const avatarContainer = document.getElementById('avatarContainer');

        uploadFoto.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    avatarContainer.innerHTML = `<img src="${e.target.result}" alt="Foto Profil">`;
                }
                reader.readAsDataURL(file);
            }
        });

        // 3. Fungsionalitas Simpan Informasi Profil
        const btnUbahProfil = document.getElementById('btnUbahProfil');

        btnUbahProfil.addEventListener('click', function() {
            alert('Informasi profil berhasil diperbarui!');
        });

        // 4. Fungsionalitas Simpan Password
        const btnSimpanPassword = document.getElementById('btnSimpanPassword');
        const passLama = document.getElementById('passLama');
        const passBaru = document.getElementById('passBaru');

        btnSimpanPassword.addEventListener('click', function() {
            if (passLama.value.trim() === '' || passBaru.value.trim() === '') {
                alert('Silakan isi kolom Password Lama dan Password Baru terlebih dahulu.');
                return;
            }
            
            alert('Password berhasil diubah!');
            passLama.value = '';
            passBaru.value = '';
        });

        // 5. Fungsionalitas Toggle Buka/Tutup Password
        function togglePasswordVisibility(inputId, iconSpan) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                // Ikon mata tertutup
                iconSpan.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            } else {
                input.type = 'password';
                // Ikon mata terbuka
                iconSpan.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        }
    </script>
</body>
</html>
