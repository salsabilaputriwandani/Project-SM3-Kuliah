<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiQ - Registrasi</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
        }
        .left-side {
            flex: 1;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }
        .left-side h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #000;
        }
        .left-side p {
            font-size: 18px;
            color: #333;
        }
        .right-side {
            flex: 1;
            background-color: #89C4FF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-left: 1px solid #333;
        }
        .form-box {
            width: 100%;
            max-width: 400px;
        }
        .form-box h2 {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            color: #000;
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #000;
        }
        /* Penyesuaian untuk input password */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .input-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #666;
            border-radius: 4px;
            font-size: 14px;
            background-color: #F4F4F4;
            outline: none;
        }
        .password-wrapper .input-control {
            padding-right: 45px;
        }
        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #333;
            display: flex;
            align-items: center;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #1E4E8C;
            color: #FFF;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #153866;
        }
        .link-text {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 500;
            color: #1E4E8C;
            text-decoration: none;
        }
        .link-text:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="left-side">
        <img src="logo.png" alt="Logo ServiQ" style="width: 250px; margin-bottom: 20px;">
        <h1>Selamat Datang di ServiQ!</h1>
        <p>Layanan servis lebih mudah, cepat, dan praktik</p>
    </div>
    <div class="right-side">
        <div class="form-box">
            <h2>Regist ServiQ</h2>
            <form action="login.html">
                <div class="input-group">
                    <label>Name</label>
                    <input type="text" class="input-control" required>
                </div>
                <div class="input-group">
                    <label>Username</label>
                    <input type="text" class="input-control" required>
                </div>
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" class="input-control" required>
                </div>
                <div class="input-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" class="input-control" id="reg-password" required>
                        <span class="toggle-password" onclick="togglePassword('reg-password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </span>
                    </div>
                </div>
                <div class="input-group">
                    <label>Confirm password</label>
                    <div class="password-wrapper">
                        <input type="password" class="input-control" id="reg-confirm-password" required>
                        <span class="toggle-password" onclick="togglePassword('reg-confirm-password', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
                        </span>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Registrasi</button>
                <a href="login.html" class="link-text">Sudah punya akun? Login</a>
            </form>
        </div>
    </div>

    <script>
        function togglePassword(inputId, iconSpan) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconSpan.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            } else {
                input.type = 'password';
                iconSpan.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>';
            }
        }
    </script>
</body>
</html>
