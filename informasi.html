<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiQ - Informasi Service Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            background-color: #D6E8FF;
            min-height: 100vh;
            color: #000;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 260px;
            background-color: #FFFFFF;
            border-right: 3px solid #000;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar::-webkit-scrollbar { display: none; }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 25px 20px;
            font-size: 24px;
            font-weight: 700;
            color: #000;
        }
        
        .logo img {
            width: 45px;
            height: auto;
        }

        .menu-section { padding: 10px 15px; flex: 1; }

        .menu-item {
            display: block;
            padding: 12px 15px;
            margin-bottom: 5px; 
            border-radius: 8px;
            text-decoration: none;
            color: #000;
            font-weight: 600;
            font-size: 15px;
            transition: 0.2s;
        }

        .menu-item:hover { background-color: #EBF3FF; }
        
        .menu-item.active {
            background-color: #60AFFF; 
            color: #000;
            font-weight: 700;
        }

        .sidebar-bottom { padding: 10px 15px; border-top: 1px solid #ddd; }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow-y: auto;
        }

        /* TOPBAR & NOTIFIKASI */
        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 15px 40px;
            background-color: #FFFFFF;
            border-bottom: 2px solid #000;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 25px;
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }

        .notification-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .notification-icon {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-dropdown {
            display: none;
            position: absolute;
            top: 35px;
            right: 0;
            width: 300px;
            background-color: #FFFFFF;
            border: 1px solid #000;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            overflow: hidden;
        }

        .notification-dropdown.show { display: block; }

        .notif-header {
            background-color: #60AFFF;
            color: #000;
            padding: 12px 15px;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 1px solid #000;
        }

        .notif-item {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            font-weight: 500;
            line-height: 1.4;
        }

        .notif-item:hover { background-color: #EBF3FF; }
        .notif-item:last-child { border-bottom: none; }
        
        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* CONTENT BODY */
        .content-body { padding: 30px 40px; }

        .page-header {
            margin-bottom: 25px;
        }

        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #000;
        }

        /* LAYOUT INFORMASI SERVICE CENTER */
        .info-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            align-items: stretch;
            margin-bottom: 25px;
        }

        .white-card {
            background-color: #FFFFFF;
            border: 1px solid #000;
            border-radius: 12px;
            padding: 25px;
        }

        /* LOGO UNGGAH SECTION */
        .logo-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 30px;
            height: 100%;
        }

        .logo-preview-box {
            width: 180px;
            height: 180px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-preview-box img {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .btn-blue {
            background-color: #1A539B;
            color: #FFF;
            border: none;
            border-radius: 6px;
            padding: 10px 25px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-block;
            text-align: center;
        }

        .btn-blue:hover {
            background-color: #123B70;
        }

        #uploadLogo {
            display: none;
        }

        /* FORM FIELD STYLE */
        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: #000;
            margin-bottom: 6px;
        }

        .form-group input {
            width: 100%;
            background-color: #E2E8F0;
            border: 1px solid #A0AEC0;
            border-radius: 6px;
            padding: 12px 15px;
            font-size: 14px;
            color: #000;
            outline: none;
            transition: 0.2s;
        }

        .form-group input:focus {
            background-color: #FFFFFF;
            border-color: #60AFFF;
            box-shadow: 0 0 0 2px rgba(96, 175, 255, 0.2);
        }

        /* TOMBOL SIMPAN PERUBAHAN DI KANAN BAWAH */
        .action-row {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        .btn-save-main {
            background-color: #1A539B;
            color: #FFF;
            border: 1px solid #000;
            border-radius: 6px;
            padding: 12px 30px;
            font-weight: 700;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-save-main:hover {
            background-color: #123B70;
        }

    </style>
</head>
<body>

    <!-- SIDEBAR -->
    <div class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="Logo">
            <span>ServiQ</span>
        </div>
        
        <div class="menu-section">
            <a href="dashboard_admin.html" class="menu-item">Dashboard</a>
            <a href="omnichannel_inbox.html" class="menu-item">Omnichannel Inbox</a>
            <a href="data_pelanggan.html" class="menu-item">Data Pelanggan</a>
            <a href="tiket_servis.html" class="menu-item">Tiket Servis</a>
            <a href="chatbot.html" class="menu-item">Chatbot</a>
            <a href="data_teknisi.html" class="menu-item">Data Teknisi</a>
            <a href="daftar_suku_cadang.html" class="menu-item">Daftar Suku Cadang</a>
            <a href="laporan.html" class="menu-item">Laporan</a>
        </div>

        <div class="sidebar-bottom">
            <a href="profil_admin.html" class="menu-item">Profil</a>
            <a href="informasi.html" class="menu-item active">Informasi</a>
            <a href="login.html" class="menu-item">Keluar</a>
        </div>
    </div>

    <!-- MAIN CONTENT -->
    <div class="main-content">
        
        <!-- TOPBAR -->
        <div class="topbar">
            <div class="user-info">
                <div class="notification-wrapper">
                    <div class="notification-icon" id="bellIcon" title="Pemberitahuan">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </div>
                    <div class="notification-dropdown" id="notifDropdown">
                        <div class="notif-header">Notifikasi Baru</div>
                        <div class="notif-item"><strong>Sistem:</strong> Pengaturan informasi service center.</div>
                    </div>
                </div>
                
                <div class="profile-info">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Admin
                </div>
            </div>
        </div>

        <div class="content-body">
            
            <div class="page-header">
                <h1>Informasi Service Center</h1>
            </div>

            <!-- MAIN GRID INFORMASI -->
            <div class="info-grid">
                
                <!-- KARTU KIRI: UNGGAH LOGO SERVICE CENTER -->
                <div class="white-card">
                    <div class="logo-section">
                        <div class="logo-preview-box" id="logoContainer">
                            <img src="logo.png" id="imgServiceLogo" alt="Logo Service Center">
                        </div>
                        
                        <label for="uploadLogo" class="btn-blue">Unggah Logo</label>
                        <input type="file" id="uploadLogo" accept="image/*">
                    </div>
                </div>

                <!-- KARTU KANAN: FORM INFORMASI SERVICE CENTER -->
                <div class="white-card">
                    
                    <div class="form-group">
                        <label>Nama Service Center</label>
                        <input type="text" id="namaSC" value="USH Service Center">
                    </div>

                    <div class="form-group">
                        <label>Nomor Telepon</label>
                        <input type="text" id="telpSC" value="021-2345-6789">
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="emailSC" value="service@gmail.com">
                    </div>

                    <div class="form-group">
                        <label>Alamat</label>
                        <input type="text" id="alamatSC" value="Jl.Pendidikan No.1, Surakarta">
                    </div>

                    <div class="form-group">
                        <label>Jam Operasional</label>
                        <input type="text" id="jamSC" value="Senin-Sabtu, 08.00-17.00">
                    </div>

                </div>

            </div>

            <!-- TOMBOL SIMPAN PERUBAHAN DI KANAN BAWAH -->
            <div class="action-row">
                <button class="btn-save-main" id="btnSimpanPerubahan">Simpan Perubahan</button>
            </div>

        </div>
    </div>

    <!-- SCRIPT FUNCTIONAL -->
    <script>
        // 1. Dropdown Lonceng Notifikasi
        const bellIcon = document.getElementById('bellIcon');
        const notifDropdown = document.getElementById('notifDropdown');

        if (bellIcon && notifDropdown) {
            bellIcon.addEventListener('click', function(e) {
                notifDropdown.classList.toggle('show');
                e.stopPropagation(); 
            });

            window.addEventListener('click', function(e) {
                if (!notifDropdown.contains(e.target) && e.target !== bellIcon) {
                    notifDropdown.classList.remove('show');
                }
            });
        }

        // 2. Fungsionalitas Unggah Logo
        const uploadLogo = document.getElementById('uploadLogo');
        const imgServiceLogo = document.getElementById('imgServiceLogo');

        uploadLogo.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    imgServiceLogo.src = e.target.result;
                }
                reader.readAsDataURL(file);
            }
        });

        // 3. Fungsionalitas Simpan Perubahan
        const btnSimpanPerubahan = document.getElementById('btnSimpanPerubahan');

        btnSimpanPerubahan.addEventListener('click', function() {
            alert('Informasi Service Center berhasil disimpan!');
        });
    </script>
</body>
</html>
