<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiQo - Profil Saya</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            display: flex;
            background-color: #EBF3FF;
            min-height: 100vh;
        }

        /* --- SIDEBAR --- */
        .sidebar {
            width: 280px;
            background-color: #FFFFFF;
            padding: 30px 20px;
            border-right: 3px solid #000;
            display: flex;
            flex-direction: column;
            position: sticky;
            top: 0;
            height: 100vh;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 40px;
            font-size: 28px;
            font-weight: 700;
            color: #000;
        }

        .logo img {
            width: 50px;
            height: auto;
        }

        .menu-item {
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            text-decoration: none;
            color: #000;
            font-weight: 600;
            font-size: 15px;
            display: flex;
            align-items: center;
            transition: 0.3s;
        }

        .menu-item:hover {
            background-color: #D6E8FF;
        }

        .menu-item.active {
            background-color: #60AFFF;
            color: #000;
        }

        .menu-item.logout {
            margin-top: auto;
        }

        /* --- MAIN CONTENT --- */
        .main-content {
            flex: 1;
            padding: 30px 50px;
            display: flex;
            flex-direction: column;
        }

        /* TOPBAR & NOTIFIKASI */
        .topbar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 2px solid #000;
            margin-bottom: 20px;
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 25px;
            font-size: 16px;
            font-weight: 600;
            color: #000;
        }

        .notification-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .notification-icon {
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .notification-dropdown {
            display: none;
            position: absolute;
            top: 35px;
            right: 0;
            width: 300px;
            background-color: #FFFFFF;
            border: 1px solid #000;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            z-index: 1000;
            overflow: hidden;
        }

        .notification-dropdown.show {
            display: block;
        }

        .notif-header {
            background-color: #60AFFF;
            color: #000;
            padding: 12px 15px;
            font-weight: 700;
            font-size: 14px;
            border-bottom: 1px solid #000;
        }

        .notif-item {
            padding: 12px 15px;
            border-bottom: 1px solid #ddd;
            font-size: 13px;
            color: #333;
            cursor: pointer;
            font-weight: 500;
            line-height: 1.4;
        }

        .notif-item:hover {
            background-color: #EBF3FF;
        }

        .notif-item:last-child {
            border-bottom: none;
        }
        
        .profile-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* --- HALAMAN PROFIL --- */
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .page-header h1 {
            font-size: 28px;
            font-weight: 700;
            color: #000;
            margin-bottom: 5px;
        }

        .page-header p {
            font-size: 14px;
            color: #333;
            font-weight: 500;
        }

        .link-notifikasi {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
            font-weight: 700;
            color: #000;
            text-decoration: none;
            transition: 0.3s;
        }

        .link-notifikasi:hover {
            opacity: 0.7;
        }

        .grid-top {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .card-box {
            background-color: #FFFFFF;
            border: 1px solid #000;
            border-radius: 12px;
            padding: 30px;
        }

        /* Card Foto */
        .photo-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .photo-card svg {
            width: 150px;
            height: 150px;
        }

        /* Info Pribadi & Form */
        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: #000;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 15px;
            font-weight: 700;
            color: #000;
            margin-bottom: 8px;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background-color: #F5F5F5;
            border: 1px solid #000;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Poppins', sans-serif;
            color: #000;
            outline: none;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .btn-blue {
            background-color: #1E4E8C;
            color: #FFF;
            border: none;
            border-radius: 8px;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-blue:hover {
            background-color: #153866;
        }

        .align-right {
            display: flex;
            justify-content: flex-end;
            margin-top: 10px;
        }

        /* PASSWORD TOGGLE STYLES */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .password-wrapper input {
            padding-right: 40px; /* Ruang untuk ikon mata */
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            cursor: pointer;
            color: #666;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: 0.2s;
        }

        .toggle-password:hover {
            color: #000;
        }

    </style>
</head>
<body>

    <div class="sidebar">
        <div class="logo">
            <img src="logo.png" alt="Logo">
            <span>ServiQo</span>
        </div>
        
        <a href="dashboard_customer.html" class="menu-item">Dashboard</a>
        <a href="buat_permintaan.html" class="menu-item">Buat Permintaan Service</a>
        <a href="tiket_saya.html" class="menu-item">Tiket Saya</a>
        <a href="riwayat_service.html" class="menu-item">Riwayat Service</a>
        <a href="chat.html" class="menu-item">Chat</a>
        <a href="profile.html" class="menu-item active">Profile</a>

        <a href="login_customer.html" class="menu-item logout">Keluar</a>
    </div>

    <div class="main-content">
        
        <div class="topbar">
            <div class="user-info">
                <!-- Fitur Lonceng Dropdown di Topbar -->
                <div class="notification-wrapper">
                    <div class="notification-icon" id="bellIcon" title="Pemberitahuan">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                    </div>
                    <div class="notification-dropdown" id="notifDropdown">
                        <div class="notif-header">Notifikasi Baru</div>
                        <div class="notif-item"><strong>Tiket #1023:</strong> Perangkat sedang dalam perbaikan.</div>
                        <div class="notif-item"><strong>Tiket #1025:</strong> Menunggu persetujuan biaya dari Anda.</div>
                    </div>
                </div>
                
                <div class="profile-info">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Andi
                </div>
            </div>
        </div>

        <div class="page-header">
            <div>
                <h1>Profil Saya</h1>
                <p>Kelola informasi akun Anda</p>
            </div>
            <!-- Tombol Link ke Halaman Notifikasi -->
            <a href="notifikasi.html" class="link-notifikasi">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
                Notifikasi
            </a>
        </div>

        <div class="grid-top">
            <!-- Box Foto Profil -->
            <div class="card-box photo-card">
                <svg viewBox="0 0 24 24" fill="black" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2C6.48 2 2 6.48 2 12C2 17.52 6.48 22 12 22C17.52 22 22 17.52 22 12C22 6.48 17.52 2 12 2ZM12 6C13.93 6 15.5 7.57 15.5 9.5C15.5 11.43 13.93 13 12 13C10.07 13 8.5 11.43 8.5 9.5C8.5 7.57 10.07 6 12 6ZM12 20C9.97 20 7.57 19.18 5.86 17.12C7.55 15.8 9.68 15 12 15C14.32 15 16.45 15.8 18.14 17.12C16.43 19.18 14.03 20 12 20Z"></path>
                </svg>
                <!-- Input File Tersembunyi untuk Upload Foto -->
                <input type="file" id="fotoUpload" accept="image/*" style="display: none;">
                <button class="btn-blue" id="btnUbahFoto">Ubah Foto</button>
            </div>

            <!-- Box Info Pribadi -->
            <div class="card-box">
                <div class="card-title">Informasi Pribadi</div>
                
                <div class="form-group">
                    <label>Nama Lengkap</label>
                    <input type="text" class="form-control" value="Andi Pratama">
                </div>
                
                <div class="form-group">
                    <label>Nomor Telepon</label>
                    <input type="text" class="form-control" value="0812 3456 7890">
                </div>
                
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" value="andi@gmail.com">
                </div>

                <!-- Tambahan Alamat -->
                <div class="form-group">
                    <label>Alamat</label>
                    <input type="text" class="form-control" value="Jl. Kenangan No.13">
                </div>

                <div class="align-right">
                    <button class="btn-blue">Ubah Profil</button>
                </div>
            </div>
        </div>

        <!-- Box Ubah Password -->
        <div class="card-box">
            <div class="card-title">Ubah Password</div>
            
            <div class="form-row">
                <div class="form-group">
                    <label>Password Lama</label>
                    <div class="password-wrapper">
                        <input type="password" id="passLamaCust" class="form-control">
                        <span class="toggle-password" onclick="togglePasswordVisibility('passLamaCust', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password Baru</label>
                    <div class="password-wrapper">
                        <input type="password" id="passBaruCust" class="form-control">
                        <span class="toggle-password" onclick="togglePasswordVisibility('passBaruCust', this)">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </span>
                    </div>
                </div>
            </div>

            <div class="align-right">
                <button class="btn-blue">Simpan</button>
            </div>
        </div>

    </div>

    <!-- Script Fungsional -->
    <script>
        // --- Notifikasi Dropdown Topbar ---
        const bellIcon = document.getElementById('bellIcon');
        const notifDropdown = document.getElementById('notifDropdown');

        if (bellIcon && notifDropdown) {
            bellIcon.addEventListener('click', function(e) {
                notifDropdown.classList.toggle('show');
                e.stopPropagation(); 
            });

            window.addEventListener('click', function(e) {
                if (!notifDropdown.contains(e.target) && e.target !== bellIcon) {
                    notifDropdown.classList.remove('show');
                }
            });
        }

        // --- Fitur Upload Foto Profil ---
        const btnUbahFoto = document.getElementById('btnUbahFoto');
        const fotoUpload = document.getElementById('fotoUpload');

        btnUbahFoto.addEventListener('click', function() {
            fotoUpload.click(); // Memicu window upload gambar
        });

        fotoUpload.addEventListener('change', function() {
            if(this.files && this.files[0]) {
                alert("Berhasil! Foto profil siap diperbarui dengan file: " + this.files[0].name);
            }
        });

        // --- Fitur Toggle Password (Mata Buka Tutup) ---
        function togglePasswordVisibility(inputId, iconSpan) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                iconSpan.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24M1 1l22 22"></path></svg>';
            } else {
                input.type = 'password';
                iconSpan.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
            }
        }
    </script>
</body>
</html>
