<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ServiQo - Lupa Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        body {
            display: flex;
            height: 100vh;
        }
        .left-side {
            flex: 1;
            background-color: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            text-align: center;
        }
        .left-side h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
            color: #000;
        }
        .left-side p {
            font-size: 18px;
            color: #333;
        }
        .right-side {
            flex: 1;
            background-color: #89C4FF;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            border-left: 1px solid #333;
        }
        .form-box {
            width: 100%;
            max-width: 400px;
        }
        .form-box h2 {
            font-size: 32px;
            font-weight: 700;
            text-align: center;
            margin-bottom: 10px;
            color: #000;
        }
        .form-desc {
            text-align: center;
            font-size: 14px;
            margin-bottom: 30px;
            color: #333;
        }
        .input-group {
            margin-bottom: 20px;
        }
        .input-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #000;
        }
        .input-control {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #666;
            border-radius: 4px;
            font-size: 14px;
            background-color: #F4F4F4;
            outline: none;
        }
        .btn-primary {
            width: 100%;
            padding: 12px;
            background-color: #1E4E8C;
            color: #FFF;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn-primary:hover {
            background-color: #153866;
        }
        .link-text {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            font-weight: 500;
            color: #1E4E8C;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="left-side">
        <!-- Memanggil logo asli -->
        <img src="logo.png" alt="Logo ServiQ" style="width: 250px; margin-bottom: 20px;">
        <h1>Selamat Datang di ServiQo!</h1>
        <p>Layanan servis lebih mudah, cepat, dan praktik</p>
    </div>
    <div class="right-side">
        <div class="form-box">
            <h2>Lupa Password</h2>
            <p class="form-desc">Masukkan alamat email yang terdaftar untuk menerima tautan reset password.</p>
            
            <!-- Simulasi form submit dengan notifikasi alert pop-up -->
            <form onsubmit="alert('Link reset password telah dikirim ke email Anda! Silakan cek kotak masuk.'); return false;">
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" class="input-control" placeholder="Contoh: admin@serviq.com" required>
                </div>
                
                <button type="submit" class="btn-primary">Kirim Link Reset</button>
                
                <!-- Otomatis kembali ke halaman login sebelumnya (Admin/Teknisi/Customer) -->
                <a href="javascript:history.back()" class="link-text">Kembali ke Halaman Login</a>
            </form>
        </div>
    </div>
</body>
</html>
